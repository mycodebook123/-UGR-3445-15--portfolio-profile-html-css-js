<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>👩🏾‍💻 Meklit Workineh</title>
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body>
    <h1>Contact</h1>
    <section class="intro">
      <h2>Connect with me</h2>
      <p>
        If you want to know more about me or my work, or if you would just like
        to say hello, send me a message. I'd love to hear from you.
      </p>
    </section>
    <main>
      <section class="first">
        <form id="contactForm">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Enter your name" required />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />

          <button type="submit">Submit</button>
        </form>
      </section>

      <section class="second">
        <div class="contact-container">
          <address>
            <p>
              <strong class="email">Email</strong>
              <br />
              <br />
              meklitworkneh780@gmail.com
            </p>

            <p>
              <strong>Address</strong>
              <br />
              <br />
              Addis Ababa, Ethiopia
            </p>
            <p><strong>Socials</strong></p>
          </address>

          <div class="social-icons">
            <a href="https://github.com/mycodebook123" target="_blank">
              <img src="Images/github.png" alt="GitHub" />
            </a>
            <a href="https://www.instagram.com/mj1232554/" target="_blank">
              <img src="Images/instagram.png" alt="Instagram" />
            </a>
            <a
              href="https://www.linkedin.com/in/meklit-daba-003aa8318/"
              target="_blank"
            >
              <img src="Images/linkedin.png" alt="LinkedIn" />
            </a>
            <a
              href="https://web.facebook.com/profile.php?id=61564765941623"
              target="_blank"
            >
              <img src="Images/facebook.png" alt="Facebook" />
            </a>
          </div>
        </div>
      </section>
    </main>

    <script src="JS/contact.js"></script>
  </body>
</html>
